<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel de administración - FarmaPlus</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="pagina-admin">


    <header class="admin-header">

        <a
    href="index.html"
    class="logo-global-enlace"
>

    <img
        src="img/logo-farmaplus.png"
        alt="FarmaPlus"
        class="logo-global-img"
    >

</a>


        <div class="admin-header-derecha">

            <a href="productos.html">
                Ver tienda
            </a>

            <div
                class="sesion-nav"
                id="sesion-nav"
            >
            </div>

        </div>

    </header>


    <main class="panel-admin">


        <div class="admin-titulo">

            <p class="admin-etiqueta">
                ADMINISTRACIÓN
            </p>

            <h1>
                Panel de administración
            </h1>

            <p>
    Administrá los productos y pedidos
    de FarmaPlus.
</p>

        </div>


        <section class="admin-opciones">


            <div class="admin-tarjeta">

                <h2>
                    📦 Productos
                </h2>

                <p>
                    Agregar, editar y administrar
                    productos de la tienda.
                </p>

             <a
    href="/admin/productos"
    class="admin-boton"
>
    Administrar productos
</a>

            </div>


            <div class="admin-tarjeta">

                <h2>
                    🧾 Pedidos
                </h2>

                <p>
                    Consultar los pedidos realizados
                    por los clientes.
                </p>

                <a
    href="/admin/pedidos"
    class="admin-boton"
>
    Ver pedidos
</a>

            </div>


        </section>


    </main>


    <script src="sesion.js"></script>

</body>

</html>
